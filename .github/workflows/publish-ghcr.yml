name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ghcr.yml', 'UPSTREAM_REF', 'Dockerfile', 'railway-entrypoint.sh']
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_REPO: egmalt/house-planner
  UPSTREAM_SHA: 5c91280da6c5cc84c1a534ef80ddafb64a6b5baa
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream image (unmodified)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/onepush-dev/house-planner
            org.opencontainers.image.licenses=MIT
          tags: ghcr.io/onepush-dev/house-planner:base-5c91280
          platforms: linux/amd64
      - name: Build Railway wrapper
        uses: docker/build-push-action@v6
        with:
          context: packaging
          push: true
          provenance: false
          build-args: BASE=ghcr.io/onepush-dev/house-planner:base-5c91280
          labels: |
            org.opencontainers.image.source=https://github.com/onepush-dev/house-planner
            org.opencontainers.image.description=House Planner (egmalt/house-planner @ 5c91280) for Railway
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/onepush-dev/house-planner:latest
            ghcr.io/onepush-dev/house-planner:5c91280-r1
          platforms: linux/amd64
