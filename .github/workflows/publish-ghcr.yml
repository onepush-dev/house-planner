name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ghcr.yml', 'UPSTREAM_REF']
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_REPO: egmalt/house-planner
  UPSTREAM_SHA: 5c91280da6c5cc84c1a534ef80ddafb64a6b5baa
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/onepush-dev/house-planner
            org.opencontainers.image.description=House Planner (egmalt/house-planner @ 5c91280) built unmodified from the upstream Dockerfile
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/onepush-dev/house-planner:latest
            ghcr.io/onepush-dev/house-planner:5c91280
          platforms: linux/amd64
